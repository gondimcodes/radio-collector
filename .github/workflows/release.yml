name: CD (Release)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release (${{ matrix.job.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        job:
          # Linux amd64
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            use_cross: false
          # Linux arm64
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            use_cross: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Cross
        if: matrix.job.use_cross
        run: |
          mkdir -p ~/.cargo/bin
          curl -L https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz | tar xz -C ~/.cargo/bin
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.job.target }}

      - name: Build standard (amd64)
        if: "!matrix.job.use_cross"
        run: cargo build --release --target ${{ matrix.job.target }}

      - name: Build cross-compiled (arm64)
        if: matrix.job.use_cross
        run: cross build --release --target ${{ matrix.job.target }}

      - name: Package tarball
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="manual"
          fi
          ASSET_NAME="radio-collector-${TAG_NAME}-linux-${{ matrix.job.arch }}.tar.gz"
          cd target/${{ matrix.job.target }}/release
          tar -czf ../../../${ASSET_NAME} radio-collector
          cd ../../..

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: radio-collector-*-linux-${{ matrix.job.arch }}.tar.gz
          generate_release_notes: true

